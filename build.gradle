plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version '3.0.2'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'be.artex'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = "https://maven.elmakers.com/repository" }
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "lunarclient"
        url = "https://repo.lunarclient.dev"
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly "org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT"
    compileOnly 'net.dmulloy2:ProtocolLib:5.3.0'
    compileOnly "com.lunarclient:apollo-api:1.2.8"

    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'fr.mrmicky:fastboard:1.2.0'
    implementation "net.kyori:adventure-api:4.17.0"
    implementation "net.kyori:adventure-text-serializer-legacy:4.17.0"
    implementation("com.github.tr7zw.Item-NBT-API:item-nbt-api:2.12.0-RC1")
}

tasks {
    runServer {
        minecraftVersion("1.8.8")
    }
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveClassifier.set('')
}

build.dependsOn(shadowJar)
jar.enabled = false
